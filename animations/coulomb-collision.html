<div class="animation-player"><video class="animation-video" aria-label="Head-on D-T collision at eta = 2 seen from above in the centre-of-mass frame, shown in three parts on the same clock, axes and scale: the classical collision alone, the quantum collision alone, and both side by side. Classical: the deuteron (small dot) and the triton (larger dot) approach along a line, slow down, turn at separation r_c and fly apart. Quantum: each nucleus is a probability cloud; the clouds approach, show interference fringes while they are reflected, and a small part reaches separations below r_c, drawn in yellow." controls loop muted playsinline preload="metadata" src="https://cloud.tugraz.at/public.php/dav/files/cPHCeEDHxptSLek/animations/coulomb_collision.mp4?v=9d6e83841cab5786" poster="../media/coulomb-collision.png" width="960">Head-on D-T collision at eta = 2 seen from above in the centre-of-mass frame, shown in three parts on the same clock, axes and scale: the classical collision alone, the quantum collision alone, and both side by side. Classical: the deuteron (small dot) and the triton (larger dot) approach along a line, slow down, turn at separation r_c and fly apart. Quantum: each nucleus is a probability cloud; the clouds approach, show interference fringes while they are reflected, and a small part reaches separations below r_c, drawn in yellow.</video><div class="animation-controls" hidden><input type="range" class="animation-seek" min="0" max="100" step="0.1" value="0" aria-label="Animation position"> <button type="button" class="animation-fullscreen" aria-label="Full screen"></button></div><p class="animation-status" role="status"></p></div><div class="animation-information"><h1>Coulomb collision</h1><figcaption>Head-on D–T collision (ℓ = 0) at η = 2 (E = 7.5 keV), seen from above in the centre-of-mass frame (the cross marks the centre of mass), shown three times on the same clock, axes and scale: classical alone, quantum alone, and both side by side. With separation r the nuclei sit at x_D = −(m_T/M) r and x_T = (m_D/M) r, M = m_D + m_T; the bar marks r_c between the turning positions, and the shaded band is r &lt; r_c. Classical: point particles on the orbit r(t) at energy E, reflected at r_c. Quantum: the densities of x_D and x_T obtained from the ℓ = 0 wave packet |u(r, t)|² (12 % energy spread) by the same relations. Incoming and reflected waves interfere into fringes, and a few per cent of the probability reaches r &lt; r_c (yellow, brightened), where tunnelling starts. The width across the collision axis is illustrative only.</figcaption>
