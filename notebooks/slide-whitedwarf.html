<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>White dwarfs and the Chandrasekhar mass</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inputs@0.12.0/dist/index.css">
<link rel="stylesheet" href="./slide-widget.css">
</head>
<body>
<div id="figure"></div>
<div id="inputs"></div>
<script type="module">
import {Plot, Inputs, html, font, sub, pow, readout, run} from "./widget.js";
import {INK, MUTED, GREY, BLUE, ORANGE} from "./plotting.js";
import ch3 from "./data/ch03_stars.json" with {type: "json"};
import wd from "./data/white-dwarfs.json" with {type: "json"};

// Cold electron-degenerate star, mu_e = 2 (hydrostatic equilibrium with the full
// Chandrasekhar equation of state, derivations/chapters/ch03_stars.py).
const C = ch3.widgets.wd, RSUN_KM = 6.957e5, REARTH_KM = 6371;
const curve = C.rho_c.map((rho, i) => ({rho, M: C.M[i], R: C.R_Rsun[i] * RSUN_KM}));
const obs = wd.stars.map((s) => ({...s, R: s.R_Rsun * RSUN_KM, dRk: s.dR * RSUN_KM}));
const HBAR = 1.054571817e-34, ME = 9.1093837e-31, CL = 2.99792458e8, MU = 1.66053906660e-27;
const xF = (rho) => (3 * Math.PI ** 2 * rho / (2 * MU)) ** (1 / 3) * HBAR / (ME * CL);   // p_F / m_e c

function draw({lr}, inputs) {
  const rho = 10 ** lr;
  const i = Math.min(curve.length - 2, Math.max(0, curve.findIndex((p) => p.rho > rho) - 1));
  const w = (lr - Math.log10(curve[i].rho)) / (Math.log10(curve[i + 1].rho) - Math.log10(curve[i].rho));
  const p = {M: curve[i].M + w * (curve[i + 1].M - curve[i].M), R: 10 ** (Math.log10(curve[i].R) + w * (Math.log10(curve[i + 1].R) - Math.log10(curve[i].R)))};
  readout(inputs.lr, `${(rho / 10 ** Math.floor(lr)).toFixed(1)} × 10${String(Math.floor(lr)).replace(/\d/g, (c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[c])} kg m⁻³`);
  const plot = sub(Plot.plot({
    width: 600, height: 430, marginLeft: 70, marginRight: 20, marginTop: 14, marginBottom: 44, style: font,
    x: {domain: [0, 1.6], label: "mass [M☉]", labelAnchor: "center", labelArrow: "none", labelOffset: 36},
    y: {type: "log", domain: [500, 30000], label: "radius [km]", labelAnchor: "center", labelArrow: "none", labelOffset: 58, ticks: [500, 1000, 2000, 5000, 10000, 20000], tickFormat: (d) => String(d)},
    marks: [
      Plot.ruleX([C.M_ch], {stroke: ORANGE, strokeWidth: 1.5, strokeDasharray: "5,4"}),
      Plot.text([{x: C.M_ch, y: 20000}], {x: "x", y: "y", text: () => `M_Ch = ${C.M_ch.toFixed(2)} M☉`, rotate: -90, dx: -8, fill: ORANGE, fontSize: 14}),
      Plot.ruleY([REARTH_KM], {stroke: GREY, strokeDasharray: "2,3"}),
      Plot.text([{x: 0.05, y: REARTH_KM}], {x: "x", y: "y", text: () => "Earth radius", dy: -8, textAnchor: "start", fill: MUTED, fontSize: 13}),
      Plot.line(curve, {x: "M", y: "R", stroke: BLUE, strokeWidth: 2.4, clip: true}),
      Plot.link(obs, {x1: (d) => d.M - d.dM, x2: (d) => d.M + d.dM, y1: "R", y2: "R", stroke: INK}),
      Plot.link(obs, {x1: "M", x2: "M", y1: (d) => d.R - d.dRk, y2: (d) => d.R + d.dRk, stroke: INK}),
      Plot.dot(obs, {x: "M", y: "R", r: 4, fill: INK}),
      Plot.text(obs, {x: "M", y: "R", text: "name", dx: 8, textAnchor: "start", fontSize: 13, filter: (d) => d.name === "Sirius B" || d.name === "Stein 2051 B", dy: 10}),
      Plot.text(obs, {x: "M", y: "R", text: "name", dx: -8, textAnchor: "end", fontSize: 13, filter: (d) => d.name === "40 Eri B", dy: -10}),
      Plot.text(obs, {x: "M", y: "R", text: "name", dx: -8, textAnchor: "end", fontSize: 13, filter: (d) => d.name === "Procyon B", dy: 10}),
      Plot.dot([p], {x: "M", y: "R", r: 8, fill: "white", stroke: BLUE, strokeWidth: 3}),
      Plot.frame({stroke: GREY}),
    ],
  }));
  const x = xF(rho);
  return html`<div style="display:flex;gap:16px;align-items:flex-start"><div style="width:600px;flex:none">${plot}</div>
<div style="width:340px;flex:none;font-size:0.86rem;line-height:1.5;color:${INK}">
  <i>M</i> = ${p.M.toFixed(3)} M☉, <i>R</i> = ${p.R.toFixed(0)} km<br>
  <i>p</i><sub>F</sub>/<i>m</i><sub>e</sub><i>c</i> = ${x.toFixed(x < 1 ? 2 : 1)} · electrons ${x < 0.3 ? "non-relativistic: R ∝ M^(−1/3)" : x < 3 ? "becoming relativistic" : "relativistic: pressure ∝ ρ^(4/3), no stable radius"}<br>
  <span style="color:${MUTED}">more mass, smaller star; at <i>M</i><sub>Ch</sub> the radius goes to zero</span>
  <div style="color:${MUTED};font-size:0.7rem;margin-top:0.5rem">curve: cold electron gas, μ<sub>e</sub> = 2 (no Coulomb or thermal corrections) · points: dynamical masses and radii, Bond et al., ApJ 848, 16 (2017), Table 2</div>
</div></div>`;
}

run({lr: Inputs.range([7, 15], {value: Math.log10(3.5e9), step: 0.01, label: html`<i>ρ</i><sub>c</sub>`})}, draw);
</script>
</body>
</html>
