<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy from fusion and fission</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inputs@0.12.0/dist/index.css">
<link rel="stylesheet" href="./slide-widget.css">
</head>
<body>
<div id="figure"></div>
<div id="inputs"></div>
<script type="module">
import {Plot, Inputs, html, font, sub, run} from "./widget.js";
import {INK, MUTED, GREY} from "./plotting.js";
import ch3 from "./data/ch03_stars.json" with {type: "json"};

// AME2020 binding energies (most bound nuclide per A) and Q values from atomic masses
// (derivations/chapters/ch03_stars.py, widget_data).
const B = ch3.widgets.binding, RX = ch3.widgets.reactions;
const BA = Object.fromEntries(B.map((b) => [`${b.Z},${b.A}`, b]));
const ame = (z, a) => BA[`${z},${a}`];
const FORCE = {weak: "#7B3294", electromagnetic: "#0072B2", strong: "#B55000"};
const INFO = {
  "D + T → ⁴He + n": ["strong", "on Earth: 10–20 keV"],
  "4 p → ⁴He": ["weak (first step), then electromagnetic and strong", "Sun: 1.35 keV"],
  "3 ⁴He → ¹²C": ["strong, γ (electromagnetic) to stabilise ¹²C", "red giant core: 8–17 keV"],
  "¹²C + ⁴He → ¹⁶O": ["electromagnetic (radiative capture)", "helium burning"],
  "2 ¹²C → ²⁰Ne + ⁴He": ["strong", "75 keV, 1000 yr (20 M☉)"],
  "2 ¹⁶O → ²⁸Si + ⁴He": ["strong", "170 keV, 1.3 yr"],
  "2 ²⁸Si → ⁵⁶Ni (net)": ["strong and electromagnetic (α captures, photodisintegration)", "280 keV, 11 days"],
  "n + ²³⁵U → ¹⁴¹Ba + ⁹²Kr + 3 n": ["strong (fission, prompt energy)", "reactor: thermal neutrons"],
};
const SUP = (n) => String(n).replace(/\d/g, (c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[c]);
const MU = 1.66053906660e-27, MEV = 1.602176634e-13;

function draw({rx}) {
  const r = RX.find((x) => x.name === rx);
  const fuel = r.from.filter(([z, a]) => a > 1).map(([z, a]) => ame(z, a)).filter(Boolean);
  const ash = r.to.filter(([z, a]) => a > 1).map(([z, a]) => ame(z, a)).filter(Boolean);
  const perA = r.Q_MeV / r.A, perKg = r.Q_MeV * MEV / (r.A * MU);
  const [force, where] = INFO[r.name];
  const col = FORCE[force.split(" ")[0]] ?? INK;
  const arrows = fuel.flatMap((f) => ash.filter((a) => a.A > 4 || ash.length === 1 || r.name.startsWith("D")).slice(0, 1).map((a) => ({x1: f.A, y1: f.BA, x2: a.A, y2: a.BA})));
  const plot = sub(Plot.plot({
    width: 600, height: 420, marginLeft: 56, marginRight: 20, marginTop: 14, marginBottom: 44, style: font,
    x: {type: "log", domain: [1.7, 260], label: "mass number A", labelAnchor: "center", labelArrow: "none", labelOffset: 36, ticks: [2, 4, 12, 28, 56, 238], tickFormat: (d) => String(d)},
    y: {domain: [0, 9.4], label: "binding energy per nucleon B/A [MeV]", labelAnchor: "center", labelArrow: "none", labelOffset: 40},
    marks: [
      Plot.line(B, {x: "A", y: "BA", stroke: GREY, strokeWidth: 1.4}),
      Plot.arrow(arrows, {x1: "x1", y1: "y1", x2: "x2", y2: "y2", bend: -25, stroke: col, strokeWidth: 2.6, headLength: 12, inset: 6}),
      Plot.dot(fuel, {x: "A", y: "BA", r: 6, fill: "white", stroke: col, strokeWidth: 2.4}),
      Plot.dot(ash, {x: "A", y: "BA", r: 6, fill: col}),
      Plot.text([...fuel, ...ash], {x: "A", y: "BA", text: (d) => `${SUP(d.A)}${d.el}`, dy: 16, fontSize: 14}),
      Plot.dot([ame(28, 62)], {x: "A", y: "BA", r: 3, fill: INK}),
      Plot.text([ame(28, 62)], {x: "A", y: "BA", text: () => "⁶²Ni: most bound", dy: -12, fontSize: 13, fill: MUTED}),
      Plot.frame({stroke: GREY}),
    ],
  }));
  return html`<div style="display:flex;gap:16px;align-items:flex-start"><div style="width:600px;flex:none">${plot}</div>
<div style="width:340px;flex:none;font-size:0.86rem;line-height:1.5;color:${INK}">
  <b>${r.name}</b><br>
  <i>Q</i> = ${r.Q_MeV.toFixed(2)} MeV · ${perA.toFixed(3)} MeV per nucleon<br>
  ${(perKg / 1e13).toFixed(perKg < 1e13 ? 2 : 1)} × 10¹³ J per kg of fuel<br>
  <span style="color:${MUTED}">= ${(perKg / 4.184e9 / 10 ** Math.floor(Math.log10(perKg / 4.184e9))).toFixed(1)} × 10<sup>${Math.floor(Math.log10(perKg / 4.184e9))}</sup> t of TNT per kg; coal: 3 × 10⁷ J/kg</span><br>
  force: <span style="color:${col}">${force}</span><br>
  <span style="color:${MUTED}">${where}</span>
  <div style="color:${MUTED};font-size:0.7rem;margin-top:0.5rem">open: fuel · filled: ash · Q from AME2020 atomic masses (Wang et al. 2021)</div>
</div></div>`;
}

run({rx: Inputs.radio(RX.map((r) => r.name), {value: RX[0].name, label: ""})}, draw);
</script>
</body>
</html>
