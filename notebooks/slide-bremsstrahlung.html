<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How bremsstrahlung arises</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inputs@0.12.0/dist/index.css">
<link rel="stylesheet" href="./slide-widget.css">
</head>
<body>
<div id="figure"></div>
<div id="inputs"></div>
<script type="module">
import {Plot, Inputs, d3, html, font, sub, pow, readout, run} from "./widget.js";
import {INK, MUTED, GREY, BLUE, ORANGE, PURPLE} from "./plotting.js";

// Units: length b_min = hbar/(m_e v) (quantum limit of the impact parameter), time b_min/v.
// The ion pulls with dimensionless strength kappa = Z e^2/(4 pi eps0 hbar v) = Z alpha c / v.
const ALPHA = 1 / 137.036, MEC2 = 511;
const speed = (ekeV) => Math.sqrt(1 - 1 / (1 + ekeV / MEC2) ** 2);   // v/c

// Coulomb attraction, velocity Verlet; returns path with acceleration magnitude.
function orbit(b, kappa) {
  const L = 14, dt = 0.004, path = [];
  let x = -L, y = b, vx = 1, vy = 0;
  const acc = (x, y) => { const r = Math.hypot(x, y); return [-kappa * x / r ** 3, -kappa * y / r ** 3]; };
  let [ax, ay] = acc(x, y);
  for (let t = 0; x < L && t < 60; t += dt) {
    path.push({t, x, y, ax, ay, a2: ax * ax + ay * ay});
    x += vx * dt + 0.5 * ax * dt * dt; y += vy * dt + 0.5 * ay * dt * dt;
    const [nx, ny] = acc(x, y);
    vx += 0.5 * (ax + nx) * dt; vy += 0.5 * (ay + ny) * dt; ax = nx; ay = ny;
  }
  return path;
}
// Radiated energy per pass in units of e^2 kappa^2 / (6 pi eps0 c^3) * (v^3 / b_min^3): integral of a^2 dt.
const energy = (path) => d3.sum(path, (p) => p.a2) * 0.004;

let frame = null;
function draw({b, ekeV, Z}, inputs) {
  if (frame) cancelAnimationFrame(frame);
  readout(inputs.b, b.toFixed(2));
  readout(inputs.ekeV, `${ekeV.toFixed(1)} keV`);
  const beta = speed(ekeV), kappa = Z * ALPHA / beta;
  const path = orbit(b, kappa), E = energy(path), straight = Math.PI / 2 * kappa * kappa / b ** 3;
  // Scene, 600 x 380 px; 1 unit = 26 px.
  const W = 600, H = 380, s = 26, cx = W / 2, cy = H / 2 + 20;
  const X = (x) => cx + s * x, Y = (y) => cy - s * y;
  const svg = d3.create("svg").attr("viewBox", `0 0 ${W} ${H}`).style("background", "#FBFCFD");
  const waves = svg.append("g");
  svg.append("circle").attr("cx", cx).attr("cy", cy).attr("r", s * 1).attr("fill", "none").attr("stroke", GREY).attr("stroke-dasharray", "3,3");
  svg.append("text").attr("x", cx + s * 1.05).attr("y", cy + 4).attr("fill", MUTED).attr("font-size", 12).text("b_min = ħ/(mₑv)");
  svg.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 9 + 1.6 * Math.sqrt(Z)).attr("fill", ORANGE);
  svg.append("text").attr("x", cx).attr("y", cy + 5).attr("text-anchor", "middle").attr("fill", "white").attr("font-size", 13).attr("font-weight", 700).text(`${Z}+`);
  svg.append("line").attr("x1", X(-11)).attr("x2", X(11)).attr("y1", Y(b)).attr("y2", Y(b)).attr("stroke", GREY).attr("stroke-dasharray", "2,4");
  svg.append("line").attr("x1", X(-10)).attr("x2", X(-10)).attr("y1", Y(0)).attr("y2", Y(b)).attr("stroke", MUTED).attr("marker-end", "");
  svg.append("text").attr("x", X(-10) + 4).attr("y", (Y(0) + Y(b)) / 2).attr("fill", MUTED).attr("font-size", 13).text("b");
  svg.append("path").attr("d", d3.line((p) => X(p.x), (p) => Y(p.y))(path)).attr("fill", "none").attr("stroke", BLUE).attr("stroke-opacity", 0.35).attr("stroke-width", 2);
  const arrow = svg.append("line").attr("stroke", PURPLE).attr("stroke-width", 2.5);
  const electron = svg.append("circle").attr("r", 7).attr("fill", BLUE);
  svg.append("text").attr("x", 12).attr("y", 22).attr("fill", INK).attr("font-size", 14)
    .text("electron (blue) passes an ion; its acceleration (purple) radiates P ∝ a²");
  // Animation: emit a wave ring every few steps, brightness proportional to a^2.
  const amax = d3.max(path, (p) => p.a2), rings = [];
  let i = 0;
  const step = () => {
    i = (i + 6) % path.length;
    const p = path[i];
    electron.attr("cx", X(p.x)).attr("cy", Y(p.y));
    const al = 3.2 / Math.sqrt(amax) * 1;
    arrow.attr("x1", X(p.x)).attr("y1", Y(p.y)).attr("x2", X(p.x + al * p.ax)).attr("y2", Y(p.y + al * p.ay));
    if (i % 24 === 0 && p.a2 > 1e-3 * amax) rings.push({x: X(p.x), y: Y(p.y), r: 4, o: p.a2 / amax});
    for (const ring of rings) ring.r += 3;
    while (rings.length && rings[0].r > 260) rings.shift();
    waves.selectAll("circle").data(rings).join("circle").attr("cx", (d) => d.x).attr("cy", (d) => d.y).attr("r", (d) => d.r)
      .attr("fill", "none").attr("stroke", PURPLE).attr("stroke-width", 2).attr("stroke-opacity", (d) => 0.9 * d.o * (1 - d.r / 260));
    frame = requestAnimationFrame(step);
  };
  frame = requestAnimationFrame(step);

  // Right: power pulse and energy per pass against b.
  const pulse = sub(Plot.plot({
    width: 340, height: 170, marginLeft: 50, marginRight: 10, marginTop: 24, marginBottom: 38, style: font,
    x: {domain: [-6, 6], label: "time [b_min/v]", labelArrow: "none", labelAnchor: "center", labelOffset: 30},
    y: {label: "P ∝ a^2", labelArrow: "none", ticks: 0},
    marks: [Plot.areaY(path.map((p) => ({t: p.x, a2: p.a2})), {x: "t", y: "a2", fill: PURPLE, fillOpacity: 0.3, stroke: PURPLE, curve: "linear"}),
      Plot.ruleY([0], {stroke: GREY})],
  }));
  const bs = d3.range(0, 41).map((k) => 0.3 * 100 ** (k / 40));
  const curve = bs.map((bb) => ({b: bb, E: energy(orbit(bb, kappa)), S: Math.PI / 2 * kappa * kappa / bb ** 3}));
  const per = sub(Plot.plot({
    width: 340, height: 200, marginLeft: 50, marginRight: 10, marginTop: 24, marginBottom: 40, style: font,
    x: {type: "log", domain: [0.3, 30], label: "b / b_min", labelArrow: "none", labelAnchor: "center", labelOffset: 30, tickFormat: String, ticks: [0.3, 1, 3, 10, 30]},
    y: {type: "log", label: "ΔE per pass", labelArrow: "none", tickFormat: pow, ticks: 4},
    marks: [
      Plot.rectX([0], {x1: 0.3, x2: 1, fill: GREY, fillOpacity: 0.18}),
      Plot.text([0], {x: 0.55, y: curve[2].S / 30, text: () => "quantum: excluded", fill: MUTED, fontSize: 11, rotate: -90}),
      Plot.line(curve, {x: "b", y: "S", stroke: GREY, strokeDasharray: "5,4"}),
      Plot.line(curve, {x: "b", y: "E", stroke: PURPLE, strokeWidth: 2.4}),
      Plot.dot([{b, E}], {x: "b", y: "E", r: 6, fill: PURPLE}),
      Plot.text([0], {x: 8, y: Math.PI / 2 * kappa * kappa / 8 ** 3 * 3, text: () => "∝ Z²/(b³ v)", fill: MUTED, fontSize: 13}),
    ],
  }));
  return html`<div style="display:flex;gap:10px;align-items:flex-start">
  <div style="width:62%">${svg.node()}</div>
  <div style="width:37%">${pulse}${per}
    <div style="font-size:0.72rem;color:${MUTED};line-height:1.35;margin-top:0.2rem">
      κ = <i>Z</i>α<i>c</i>/<i>v</i> = ${kappa.toFixed(3)} · <i>v</i> = ${beta.toFixed(3)} <i>c</i><br>
      ${kappa < 0.3 ? "κ ≪ 1: almost straight, a weak kick" : kappa < 1 ? "κ < 1: the path bends noticeably" : "κ ≳ 1: strong deflection (cold electron, high Z)"};
      far passes radiate ΔE ∝ <i>Z</i>²/(<i>b</i>³<i>v</i>)<br>
      this pass: ${(E / straight).toFixed(2)} × the straight-line value
    </div></div>
</div>`;
}

run({
  b: Inputs.range([0.3, 10], {value: 1.5, step: 0.05, label: html`<i>b</i> / <i>b</i><sub>min</sub>`}),
  ekeV: Inputs.range([0.3, 30], {value: 5, step: 0.1, label: html`<i>E</i><sub>e</sub> [keV]`}),
  Z: Inputs.radio([1, 2, 4, 6, 8], {value: 6, label: html`ion <i>Z</i>`}),
}, draw);
</script>
</body>
</html>
