<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The age of meteorites and the Earth</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inputs@0.12.0/dist/index.css">
<link rel="stylesheet" href="./slide-widget.css">
</head>
<body>
<div id="figure"></div>
<div id="inputs"></div>
<script type="module">
import {Plot, Inputs, html, font, sub, readout, run} from "./widget.js";
import {INK, MUTED, GREY, BLUE, ORANGE, GREEN} from "./plotting.js";
import age from "./data/earth-age.json" with {type: "json"};
import ch3 from "./data/ch03_stars.json" with {type: "json"};

// Patterson (1956) lead in meteorites. Every meteorite started with the primordial lead of
// Canyon Diablo and its own 238U/204Pb ratio mu; its lead then grew along its own curve.
// Decay constants: Jaffey et al. (1971); 238U/235U = 137.818 (Hiess et al. 2012).
const P = age.patterson_1956, DC = age.decay_constants, FIT = ch3.widgets.isochron.fit;
const L8 = DC.lambda_238_per_yr, L5 = DC.lambda_235_per_yr, K = DC.U238_U235, T = FIT.age_yr;
const prim = P.meteorites.find((m) => m.name === "Canyon Diablo");
// mu today from the measured 206/204 at the fitted age.
const met = P.meteorites.map((m) => ({...m, mu: (m.r64 - prim.r64) / Math.expm1(L8 * T)}));
const at = (m, tau) => ({x: prim.r64 + m.mu * (Math.exp(L8 * T) - Math.exp(L8 * (T - tau))),
  y: prim.r74 + m.mu / K * (Math.exp(L5 * T) - Math.exp(L5 * (T - tau)))});
const sed = P.ocean_sediment;

function draw({tau}, inputs) {
  const t = tau * 1e9;
  readout(inputs.tau, `${tau.toFixed(2)} Gyr`);
  const now = met.map((m) => ({...m, ...at(m, t)}));
  const slope = t > 0 ? (Math.exp(L5 * T) - Math.exp(L5 * (T - t))) / (K * (Math.exp(L8 * T) - Math.exp(L8 * (T - t)))) : 1 / K * L5 / L8;
  const line = [{x: prim.r64, y: prim.r74}, {x: 56, y: prim.r74 + slope * (56 - prim.r64)}];
  const paths = met.flatMap((m) => Array.from({length: 60}, (_, i) => ({name: m.name, ...at(m, T * i / 59)})));
  const done = Math.abs(t - T) < 0.03e9;
  const plot = sub(Plot.plot({
    width: 600, height: 430, marginLeft: 64, marginRight: 20, marginTop: 14, marginBottom: 46, style: font,
    x: {domain: [0, 56], label: "²⁰⁶Pb/²⁰⁴Pb", labelAnchor: "center", labelArrow: "none", labelOffset: 38},
    y: {domain: [0, 40], label: "²⁰⁷Pb/²⁰⁴Pb", labelAnchor: "center", labelArrow: "none", labelOffset: 46},
    marks: [
      Plot.line(paths, {x: "x", y: "y", z: "name", stroke: GREY, strokeDasharray: "3,4"}),
      Plot.line(line, {x: "x", y: "y", stroke: ORANGE, strokeWidth: 2.4, clip: true}),
      Plot.link(P.meteorites, {x1: (m) => m.r64 * (1 - m.rel_err), x2: (m) => m.r64 * (1 + m.rel_err), y1: "r74", y2: "r74", stroke: INK}),
      Plot.link(P.meteorites, {x1: "r64", x2: "r64", y1: (m) => m.r74 * (1 - m.rel_err), y2: (m) => m.r74 * (1 + m.rel_err), stroke: INK}),
      Plot.dot(P.meteorites, {x: "r64", y: "r74", r: 6, stroke: INK, strokeWidth: 1.5, fill: "white"}),
      Plot.dot(now, {x: "x", y: "y", r: 4.5, fill: ORANGE}),
      Plot.dot([sed], {x: "r64", y: "r74", r: 7, stroke: GREEN, strokeWidth: 2.4, fill: "none"}),
      Plot.text([sed], {x: "r64", y: "r74", text: () => "Earth: ocean sediment", dx: 12, dy: 14, textAnchor: "start", fill: GREEN, fontSize: 14}),
      Plot.text(P.meteorites.filter((m) => m.name === "Nuevo Laredo" || m.name === "Forest City"), {x: "r64", y: "r74", text: "name", dx: -10, dy: -12, textAnchor: "end", fontSize: 13, fill: MUTED}),
      Plot.text([prim], {x: "r64", y: "r74", text: () => "Canyon Diablo: primordial lead", dx: 10, dy: 16, textAnchor: "start", fontSize: 13, fill: MUTED}),
      Plot.frame({stroke: GREY}),
    ],
  }));
  return html`<div style="display:flex;gap:16px;align-items:flex-start"><div style="width:600px;flex:none">${plot}</div>
<div style="width:340px;flex:none;font-size:0.84rem;line-height:1.5;color:${INK}">
  <b>${tau.toFixed(2)} Gyr after formation</b><br>
  slope of the line = radiogenic ²⁰⁷Pb*/²⁰⁶Pb* = ${slope.toFixed(3)}<br>
  <span style="color:${MUTED}">(<i>e</i><sup><i>λ</i>₂₃₅<i>t</i></sup> − 1) / [137.8 (<i>e</i><sup><i>λ</i>₂₃₈<i>t</i></sup> − 1)]: depends only on <i>t</i></span><br>
  <span style="color:${done ? ORANGE : MUTED}">${done ? "today: the line runs through the measured leads" : "slide to today"}</span>
  <div style="margin-top:0.5rem">fit: <b>${(FIT.age_yr / 1e9).toFixed(2)} ± ${(FIT.age_err_yr / 1e9).toFixed(2)} Gyr</b><br>
  <span style="color:${MUTED}">Patterson 1956: ${P.age_Gyr} ± ${P.age_err_Gyr} Gyr (older decay constants) · oldest solids today: 4.567 Gyr</span></div>
  <div style="margin-top:0.5rem">Earth lead lies on the same line: Earth formed from the same material at the same time.</div>
  <div style="color:${MUTED};font-size:0.68rem;margin-top:0.5rem">open: measured (Patterson, GCA 10, 230, 1956) · filled: grown from primordial lead · dashed: growth of each meteorite · decay constants: Jaffey et al. (1971)</div>
</div></div>`;
}

run({tau: Inputs.range([0, 4.6], {value: Number((T / 1e9).toFixed(2)), step: 0.01, label: html`time <i>t</i>`})}, draw);
</script>
</body>
</html>
