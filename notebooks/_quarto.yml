# Rendered by make from a staging copy per notebook that adds the data files.
project:
  type: default
  output-dir: _site

format:
  html:
    theme: cosmo
    css: notebook.css
    embed-resources: true
    toc: false
    echo: false
    smooth-scroll: false
    html-math-method: mathjax
    lang: en
    license: "CC BY"
    # Same icon as the presenter (public/present/icon.svg) on the published site.
    include-in-header:
      text: '<link rel="icon" href="../present/icon.svg" type="image/svg+xml">'

execute:
  echo: false
