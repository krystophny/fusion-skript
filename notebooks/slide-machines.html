<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where present-day machines stand</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inputs@0.12.0/dist/index.css">
<link rel="stylesheet" href="./slide-widget.css">
</head>
<body>
<div id="figure"></div>
<div class="legend" style="display:flex;gap:1rem;font-size:0.72rem;margin:0.1rem 0.6rem;color:#526175">
<span><span style="color:#0072B2">●</span> tokamak</span>
<span><span style="color:#B55000">●</span> stellarator</span>
<span><span style="color:#9AA5B1">●</span> other magnetic</span>
<span>○ design</span>
<span><span style="color:#B55000">▭</span> D–T reactor window</span>
<span style="margin-left:auto">Peak values; gain curves for peaked profiles, Z<sub>eff</sub> 1.5–3.4; data: Wurzel &amp; Hsu, Phys. Plasmas 29, 062103 (2022)</span>
</div>
<div id="inputs"></div>
<script type="module">
import {Plot, Inputs, d3, html, font, sub, pow, run} from "./widget.js";
import {peakTripleProduct} from "./fusion.js";
import {INK, MUTED, GREY, BLUE, ORANGE} from "./plotting.js";
import rx from "./data/reactivity.json" with {type: "json"};

const csv = await (await fetch("./data/wurzel_hsu_2022.csv")).text();
const group = (r) => r.concept === "Stellarator" ? "stellarator"
  : r.concept === "Tokamak" || r.concept === "Spherical Tokamak" ? "tokamak" : "other";
// Magnetic confinement only (Wurzel & Hsu 2022, Tables 6 and 7); peak ion density, tau_E*.
const rows = d3.csvParse(csv.split("\n").filter((l) => !l.startsWith("#")).join("\n"))
  .filter((r) => r.table !== "8" && r.T_keV && r.n_m3 && r.tau_s)
  .map((r) => ({name: `${r.project} ${r.year}`, project: r.project, T: +r.T_keV, n: +r.n_m3,
    tau: +r.tau_s, nTtau: +r.T_keV * +r.n_m3 * +r.tau_s, group: group(r), design: r.shot === "Projected"}));
const measured = rows.filter((r) => !r.design);
const designs = rows.filter((r) => r.design);
const colour = {tokamak: BLUE, stellarator: ORANGE, other: GREY};
// D-T reactor window used in all panels.
const win = {T: [10, 25], n: [5e19, 3e20], tau: [1, 5]};
// The data are peak values, so the gain curves are too (Wurzel & Hsu Eq. 45):
// peaked T, broad n, Z_eff from 1.5 (lower edge) to 3.4 (upper edge).
const ZEFF = [1.5, 3.4];
const tGrid = d3.range(0, 201).map((i) => 1.5 * 40 ** (i / 200));
const band = (q) => tGrid.map((t) => ({t, lo: peakTripleProduct(rx, t, q, {zeff: ZEFF[0]}),
  hi: Math.min(peakTripleProduct(rx, t, q, {zeff: ZEFF[1]}), 1e23)})).filter((d) => Number.isFinite(d.lo));
const nTauIgnition = peakTripleProduct(rx, 13.5, Infinity, {zeff: ZEFF[0]}) / 13.5;
const axis = {
  T: {type: "log", domain: [0.1, 60], label: "k_B T [keV]", ticks: [0.1, 1, 10], tickFormat: (d) => String(d)},
  n: {type: "log", domain: [1e17, 3e21], label: "n [m^−3]", ticks: [1e17, 1e18, 1e19, 1e20, 1e21]},
  tau: {type: "log", domain: [1e-4, 20], label: "τ_E [s]", ticks: [1e-4, 1e-3, 1e-2, 0.1, 1, 10]},
};
const tip = (r) => `${r.name}${r.design ? " (design)" : ""}\nT = ${r.T} keV, n = ${r.n.toExponential(1)} m⁻³, τ = ${r.tau} s`;

const panel = (x, y, {w = 318, h = 400, guides = [], left = 62} = {}) => sub(Plot.plot({
  width: w, height: h, marginLeft: left, marginRight: 14, marginTop: 30, marginBottom: 62, style: font, clip: true,
  x: {...axis[x], tickFormat: pow, labelAnchor: "center", labelArrow: "none", labelOffset: 40},
  y: {...axis[y], tickFormat: pow, labelArrow: "none"},
  marks: [
    Plot.rect([0], {x1: win[x][0], x2: win[x][1], y1: win[y][0], y2: win[y][1],
      fill: "#B5500018", stroke: ORANGE, strokeDasharray: "4,3"}),
    ...guides,
    Plot.dot(measured.filter((r) => r.group === "other"), {x, y, r: 3.2, fill: GREY, fillOpacity: 0.6}),
    Plot.dot(measured.filter((r) => r.group !== "other"), {x, y, r: 4.2, fill: (r) => colour[r.group], stroke: "white", strokeWidth: 0.6}),
    Plot.dot(designs, {x, y, r: 5.5, stroke: INK, strokeWidth: 1.6, fill: "white"}),
    Plot.text(designs, {x, y, text: "project", dx: -9, textAnchor: "end", fill: INK, fontSize: 14}),
    Plot.tip(rows, Plot.pointer({x, y, title: tip})),
  ],
}));

function draw({view}) {
  return view === "three cross-sections" ? html`<div style="display:flex;justify-content:space-between">
  ${panel("T", "n", {guides: [
    ...[1e5, 1e6].map((p) => Plot.line([0.1, 60], {x: (t) => t, y: (t) => p / (2 * t * 1.602e-16), stroke: GREY, strokeDasharray: "2,3"})),
    Plot.text([0], {x: 2, y: 1e6 / (2 * 2 * 1.602e-16), text: () => "10 bar", fill: MUTED, fontSize: 13, dy: -8, rotate: -40}),
    Plot.text([0], {x: 2, y: 1e5 / (2 * 2 * 1.602e-16), text: () => "1 bar", fill: MUTED, fontSize: 13, dy: -8, rotate: -40}),
  ]})}
  ${panel("n", "tau", {guides: [
    ...[1e18, 1e19, 1e20].map((nt) => Plot.line([1e17, 3e21], {x: (n) => n, y: (n) => nt / n, stroke: GREY, strokeDasharray: "2,3"})),
    Plot.line([1e17, 3e21], {x: (n) => n, y: (n) => nTauIgnition / n, stroke: ORANGE, strokeWidth: 1.4}),
    Plot.text([0], {x: 2.9e21, y: 15, text: () => "ignition, 13.5 keV", fill: ORANGE, fontSize: 12, textAnchor: "end"}),
  ]})}
  ${panel("T", "tau")}
</div>` : sub(Plot.plot({
    width: 960, height: 400, marginLeft: 76, marginRight: 90, marginTop: 30, marginBottom: 62, style: font, clip: true,
    x: {type: "log", domain: [0.1, 60], label: "k_B T [keV]", tickFormat: pow, ticks: [0.1, 1, 10], labelArrow: "none", labelAnchor: "center", labelOffset: 40},
    y: {type: "log", domain: [1e15, 1e23], label: "n k_B T τ_E [keV s m^−3]", tickFormat: pow, ticks: [1e15, 1e17, 1e19, 1e21, 1e23], labelArrow: "none"},
    marks: [
      ...[[1, GREY], [10, BLUE], [Infinity, ORANGE]].flatMap(([q, c]) => [
        Plot.areaY(band(q), {x: "t", y1: "lo", y2: "hi", fill: c, fillOpacity: 0.16}),
        Plot.line(band(q), {x: "t", y: "lo", stroke: c, strokeWidth: 2})]),
      ...[[1, GREY, "Q = 1"], [10, BLUE, "Q = 10"], [Infinity, ORANGE, "ignition"]].map(([q, c, s]) =>
        Plot.text([0], {x: 60, y: peakTripleProduct(rx, 60, q, {zeff: ZEFF[0]}), text: () => s, fill: c, dx: 6, dy: q === 10 ? 4 : q === 1 ? 0 : -6, textAnchor: "start", clip: false})),
      Plot.dot(measured.filter((r) => r.group === "other"), {x: "T", y: "nTtau", r: 3.2, fill: GREY, fillOpacity: 0.6}),
      Plot.dot(measured.filter((r) => r.group !== "other"), {x: "T", y: "nTtau", r: 4.5, fill: (r) => colour[r.group], stroke: "white", strokeWidth: 0.6}),
      Plot.dot(designs, {x: "T", y: "nTtau", r: 6, stroke: INK, strokeWidth: 1.6, fill: "white"}),
      Plot.text(designs.filter((d) => d.project === "ITER"), {x: "T", y: "nTtau", text: "project", dx: 10, dy: -10, textAnchor: "start"}),
      Plot.text(designs.filter((d) => d.project !== "ITER"), {x: "T", y: "nTtau", text: "project", dx: -10, dy: -10, textAnchor: "end"}),
      Plot.tip(rows, Plot.pointer({x: "T", y: "nTtau", title: tip})),
    ],
  }));
}

run({
  view: Inputs.radio(["three cross-sections", "triple product"], {value: "three cross-sections", label: "view"}),
}, draw);
</script>
</body>
</html>
